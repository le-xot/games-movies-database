name: Checks

on:
  push:
    branches:
      - master
  pull_request: {}

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: le_xot
          POSTGRES_PASSWORD: abc
          POSTGRES_DB: lists_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U le_xot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check migrations are up to date
        env:
          DATASOURCE_URL: postgresql://user:password@localhost:5432/db
        run: |
          cd database
          bunx drizzle-kit generate --name ci-drift-check
          cd ..
          git diff --exit-code -- database/migrations

      - name: Lint
        run: bun lint

      - name: Socket contract
        run: bun run check:socket

      - name: Format check
        run: bun format:check

      - name: Cache vue-tsc incremental state
        uses: actions/cache@v4
        with:
          path: frontend/node_modules/.cache/vue-tsc
          key: vue-tsc-${{ runner.os }}-${{ hashFiles('frontend/tsconfig.json', 'frontend/src/**', 'bun.lock') }}
          restore-keys: |
            vue-tsc-${{ runner.os }}-

      - name: Typecheck
        run: bun typecheck

      - name: Prepare test env
        run: cp backend/.env.example backend/.env

      - name: Test backend
        env:
          NODE_ENV: development
        run: cd backend && bun test

      - name: Test frontend
        run: cd frontend && bun test

      - name: Integration tests
        env:
          RUN_DB_TESTS: '1'
          TEST_DATASOURCE_URL: postgresql://le_xot:abc@127.0.0.1:5432/lists_test
        run: bun --filter=./backend run test:integration

      - name: API client drift check
        env:
          DATASOURCE_URL: postgresql://le_xot:abc@127.0.0.1:5432/lists_test
        run: |
          cd backend
          bun run start &
          BACKEND_PID=$!
          for i in $(seq 1 30); do curl -sf http://localhost:3000/docs-json > /dev/null && break; sleep 1; done
          cd ..
          bun --filter=./frontend run generate:api
          kill $BACKEND_PID || true
          git diff --exit-code -- frontend/src/lib/api.ts

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: le_xot
          POSTGRES_PASSWORD: abc
          POSTGRES_DB: lists_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U le_xot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install playwright chromium
        run: cd frontend && bunx playwright install --with-deps chromium

      - name: Prepare test env
        run: cp backend/.env.example backend/.env

      - name: Run E2E
        run: bun run test:e2e

      - name: Upload playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7
