name: Checks

on:
  push:
    branches:
      - master
  pull_request: {}

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: le_xot
          POSTGRES_PASSWORD: abc
          POSTGRES_DB: lists_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U le_xot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Cache bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check migrations are up to date
        env:
          DATASOURCE_URL: postgresql://user:password@localhost:5432/db
        run: |
          cd database
          bunx drizzle-kit generate --name ci-drift-check
          cd ..
          git diff --exit-code -- database/migrations

      - name: Lint
        run: bun lint

      - name: Script tests
        run: bun run test:scripts

      - name: Format check
        run: bun format:check

      - name: Cache vue-tsc incremental state
        uses: actions/cache@v6
        with:
          path: frontend/node_modules/.cache/vue-tsc
          key: vue-tsc-${{ runner.os }}-${{ hashFiles('frontend/tsconfig.json', 'frontend/src/**', 'bun.lock') }}
          restore-keys: |
            vue-tsc-${{ runner.os }}-

      - name: Typecheck
        run: bun typecheck

      - name: Prepare test env
        run: cp backend/.env.example backend/.env

      - name: Test backend
        env:
          NODE_ENV: development
        run: cd backend && bun test

      - name: Test frontend
        run: cd frontend && bun run test

      - name: Integration tests
        env:
          RUN_DB_TESTS: '1'
          TEST_DATASOURCE_URL: postgresql://le_xot:abc@127.0.0.1:5432/lists_test
        run: bun --filter=./backend run test:integration

  # Образы собираются только в deploy-пайплайне на master. Без этой проверки
  # сломанный Dockerfile (например, забытый workspace `contract`) всплывает
  # уже после мержа — и валит весь деплой.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: gmd-app:ci
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build migrations image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./database/Dockerfile
          push: false
          load: true
          tags: gmd-migrations:ci
          cache-from: type=gha,scope=migrations
          cache-to: type=gha,mode=max,scope=migrations

      - name: Smoke test the app image
        run: |
          docker run -d --name gmd-smoke -p 3000:3000 \
            -e NODE_ENV=production \
            -e DATASOURCE_URL=postgresql://user:password@127.0.0.1:5432/db \
            -e JWT_SECRET=ci-smoke-secret \
            -e TWITCH_CALLBACK_URL=http://localhost:3000/api/auth/twitch/callback \
            -e WORDLE_ANSWERS_SALT=ci-smoke-salt \
            gmd-app:ci

          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then break; fi
            sleep 1
          done

          curl -fsS http://localhost:3000/api/health | grep -q '"status":"ok"'
          curl -fsS http://localhost:3000/db/games | grep -q '<!doctype html'
          curl -sS -o /dev/null -w '%{http_code}' http://localhost:3000/api/nope | grep -q 404

      - name: Container logs
        if: failure()
        run: docker logs gmd-smoke
