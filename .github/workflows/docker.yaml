name: Deploy to server

on:
  workflow_run:
    workflows: ['Checks']
    types: [completed]
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/le-xot/games-movies-database:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push migrations image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./database/Dockerfile
          push: true
          tags: ghcr.io/le-xot/games-movies-database-migrations:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Upload compose file and render script
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            docker-compose.yml scripts/render-env.sh \
            "$SERVER_USER@$SERVER_HOST:/home/lexot/games-movies-database/"

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SERVER_USER@$SERVER_HOST" \
            'set -e; cd /home/lexot/games-movies-database && bash render-env.sh && docker compose pull application migrations && docker compose up -d --remove-orphans && docker image prune -f'
