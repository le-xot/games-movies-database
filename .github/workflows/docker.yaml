name: Deploy to server

on:
  workflow_run:
    workflows: ['Checks']
    types: [completed]
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/le-xot/games-movies-database:latest
            ghcr.io/le-xot/games-movies-database:sha-${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Build and push migrations image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./database/Dockerfile
          push: true
          tags: |
            ghcr.io/le-xot/games-movies-database-migrations:latest
            ghcr.io/le-xot/games-movies-database-migrations:sha-${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=migrations
          cache-to: type=gha,mode=max,scope=migrations

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/home/lexot/games-movies-database' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Upload compose file and render script
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            docker-compose.yml scripts/render-env.sh scripts/rollback.sh \
            "$SERVER_USER@$SERVER_HOST:$DEPLOY_DIR/"

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SERVER_USER@$SERVER_HOST" \
            "set -e; cd $DEPLOY_DIR && \
             docker compose ps -q application | xargs -r docker inspect --format '{{.Image}}' > .rollback-image || true; \
             bash render-env.sh && docker compose pull application migrations logs && \
             docker compose up -d --remove-orphans && docker image prune -f --filter until=168h"

      - name: Health check
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SERVER_USER@$SERVER_HOST" \
            "set -e; cd $DEPLOY_DIR; \
             for _ in \$(seq 1 30); do curl -fsS --max-time 5 https://le-xot.dev/api/health > /dev/null && exit 0; sleep 2; done; \
             echo 'health check failed'; docker compose logs --tail 50 application || true; \
             bash rollback.sh || echo 'rollback failed — нужен ручной разбор'; exit 1"
