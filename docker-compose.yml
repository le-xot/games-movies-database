services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    mem_limit: 512m
    cpus: '0.5'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-le_xot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lists}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-le_xot} -d ${POSTGRES_DB:-lists}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    mem_limit: 1g
    cpus: '0.5'
    volumes:
      - rustfs_data:/data
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      # Консоль не нужна: бакеты и объекты смотрим через DBX (плагин S3 Browser)
      RUSTFS_CONSOLE_ENABLE: 'false'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    cpus: '0.25'
    volumes:
      - redis_data:/data

  migrations:
    image: ghcr.io/le-xot/games-movies-database-migrations:latest
    restart: 'no'
    mem_limit: 256m
    cpus: '0.25'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATASOURCE_URL: postgresql://${POSTGRES_USER:-le_xot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lists}
    networks:
      - default

  dbx:
    image: t8y2/dbx:0.6.45
    restart: unless-stopped
    mem_limit: 512m
    cpus: '0.5'
    volumes:
      - dbx_data:/app/data
    environment:
      DBX_PASSWORD: ${DBX_PASSWORD}
    networks:
      - default
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.gmd-dbx.rule=Host(`dbx.le-xot.dev`)
      - traefik.http.routers.gmd-dbx.entrypoints=websecure
      - traefik.http.routers.gmd-dbx.tls.certresolver=le
      - traefik.http.routers.gmd-dbx.service=gmd-dbx
      - traefik.http.services.gmd-dbx.loadbalancer.server.port=4224
      - traefik.http.middlewares.gmd-dbx-ipallow.ipallowlist.sourcerange=${ADMIN_ALLOWED_IPS:-178.105.174.181/32}
      - traefik.http.routers.gmd-dbx.middlewares=gmd-dbx-ipallow
      - traefik.http.routers.gmd-dbx-web.rule=Host(`dbx.le-xot.dev`)
      - traefik.http.routers.gmd-dbx-web.entrypoints=web
      - traefik.http.routers.gmd-dbx-web.service=gmd-dbx
      - traefik.http.routers.gmd-dbx-web.middlewares=gmd-dbx-ipallow,gmd-dbx-redirect
      - traefik.http.middlewares.gmd-dbx-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.gmd-dbx-redirect.redirectscheme.permanent=true

  application:
    image: ghcr.io/le-xot/games-movies-database:latest
    restart: unless-stopped
    mem_limit: 1g
    cpus: '1.5'
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      rustfs:
        condition: service_started
      redis:
        condition: service_started
    env_file: .env
    environment:
      DATASOURCE_URL: postgresql://${POSTGRES_USER:-le_xot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lists}
      REDIS_URL: redis://redis:6379
    networks:
      - default
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.gmd-app.rule=Host(`le-xot.dev`)
      - traefik.http.routers.gmd-app.entrypoints=websecure
      - traefik.http.routers.gmd-app.tls.certresolver=le
      - traefik.http.routers.gmd-app.middlewares=gmd-gzip
      - traefik.http.routers.gmd-app.service=gmd-app
      - traefik.http.services.gmd-app.loadbalancer.server.port=3000
      - traefik.http.routers.gmd-app-web.rule=Host(`le-xot.dev`)
      - traefik.http.routers.gmd-app-web.entrypoints=web
      - traefik.http.routers.gmd-app-web.service=gmd-app
      - traefik.http.routers.gmd-app-web.middlewares=gmd-app-redirect
      - traefik.http.middlewares.gmd-app-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.gmd-app-redirect.redirectscheme.permanent=true
      - traefik.http.middlewares.gmd-gzip.compress=true

volumes:
  pgdata:
  rustfs_data:
  redis_data:
  dbx_data:

networks:
  traefik:
    external: true
    name: traefik-public
