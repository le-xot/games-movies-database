services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    mem_limit: 512m
    cpus: '0.5'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-le_xot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lists}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-le_xot} -d ${POSTGRES_DB:-lists}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    mem_limit: 1g
    cpus: '0.5'
    volumes:
      - rustfs_data:/data
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_CONSOLE_ENABLE: 'true'
    networks:
      - default
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.gmd-rustfs.rule=Host(`rustfs.le-xot.dev`)
      - traefik.http.routers.gmd-rustfs.entrypoints=websecure
      - traefik.http.routers.gmd-rustfs.tls.certresolver=le
      - traefik.http.routers.gmd-rustfs.service=gmd-rustfs
      - traefik.http.services.gmd-rustfs.loadbalancer.server.port=9001
      - traefik.http.routers.gmd-rustfs-web.rule=Host(`rustfs.le-xot.dev`)
      - traefik.http.routers.gmd-rustfs-web.entrypoints=web
      - traefik.http.routers.gmd-rustfs-web.service=gmd-rustfs
      - traefik.http.routers.gmd-rustfs-web.middlewares=gmd-rustfs-redirect
      - traefik.http.middlewares.gmd-rustfs-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.gmd-rustfs-redirect.redirectscheme.permanent=true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 256m
    cpus: '0.25'
    volumes:
      - redis_data:/data

  migrations:
    build:
      context: .
      dockerfile: database/Dockerfile
    image: lexot/games-movies-database-migrations:latest
    restart: 'no'
    mem_limit: 256m
    cpus: '0.25'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATASOURCE_URL: postgresql://${POSTGRES_USER:-le_xot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lists}
    networks:
      - default

  admin:
    image: adminer
    restart: unless-stopped
    mem_limit: 128m
    cpus: '0.25'
    depends_on:
      - postgres
    networks:
      - default
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.gmd-adminer.rule=Host(`adminer.le-xot.dev`)
      - traefik.http.routers.gmd-adminer.entrypoints=websecure
      - traefik.http.routers.gmd-adminer.tls.certresolver=le
      - traefik.http.routers.gmd-adminer.service=gmd-adminer
      - traefik.http.services.gmd-adminer.loadbalancer.server.port=8080
      - traefik.http.routers.gmd-adminer-web.rule=Host(`adminer.le-xot.dev`)
      - traefik.http.routers.gmd-adminer-web.entrypoints=web
      - traefik.http.routers.gmd-adminer-web.service=gmd-adminer
      - traefik.http.routers.gmd-adminer-web.middlewares=gmd-adminer-redirect
      - traefik.http.middlewares.gmd-adminer-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.gmd-adminer-redirect.redirectscheme.permanent=true

  application:
    build:
      context: .
      dockerfile: Dockerfile
    image: lexot/games-movies-database:latest
    restart: unless-stopped
    mem_limit: 1g
    cpus: '1.5'
    depends_on:
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      rustfs:
        condition: service_started
      redis:
        condition: service_started
    env_file: .env
    environment:
      DATASOURCE_URL: postgresql://${POSTGRES_USER:-le_xot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lists}
      REDIS_URL: redis://redis:6379
    networks:
      - default
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-public
      - traefik.http.routers.gmd-app.rule=Host(`le-xot.dev`)
      - traefik.http.routers.gmd-app.entrypoints=websecure
      - traefik.http.routers.gmd-app.tls.certresolver=le
      - traefik.http.routers.gmd-app.middlewares=gmd-gzip
      - traefik.http.routers.gmd-app.service=gmd-app
      - traefik.http.services.gmd-app.loadbalancer.server.port=3000
      - traefik.http.routers.gmd-app-web.rule=Host(`le-xot.dev`)
      - traefik.http.routers.gmd-app-web.entrypoints=web
      - traefik.http.routers.gmd-app-web.service=gmd-app
      - traefik.http.routers.gmd-app-web.middlewares=gmd-app-redirect
      - traefik.http.middlewares.gmd-app-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.gmd-app-redirect.redirectscheme.permanent=true
      - traefik.http.middlewares.gmd-gzip.compress=true

volumes:
  pgdata:
  rustfs_data:
  redis_data:

networks:
  traefik:
    external: true
    name: traefik-public
