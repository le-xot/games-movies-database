<!doctype html>
<html class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Сайт Лешота</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link
      rel="preload"
      href="/fonts/inter-cyrillic-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // Бренд заставки выбираем по адресу до парсинга body.
      ;(function () {
        var path = window.location.pathname
        var variant = 'home'
        if (path === '/db' || path.indexOf('/db/') === 0) variant = 'db'
        else if (path === '/pc' || path.indexOf('/pc/') === 0) variant = 'pc'
        document.documentElement.dataset.splash = variant
      })()
    </script>
    <style>
      /* Те же лица, что и в бандле: заставка не должна ждать загрузки CSS. */
      @font-face {
        font-family: 'Inter Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url('/fonts/inter-cyrillic-wght-normal.woff2') format('woff2-variations');
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }

      @font-face {
        font-family: 'Inter Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        src: url('/fonts/inter-latin-wght-normal.woff2') format('woff2-variations');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308,
          U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }

      /* Инлайн, чтобы тёмный фон и заставка были до загрузки CSS-бандла. */
      html,
      body {
        margin: 0;
        background-color: oklch(0.145 0 0);
        color: oklch(0.985 0 0);
      }

      #app {
        min-height: 100vh;
      }

      /* Заставка живёт вне #app: так Vue не стирает её мгновенно, а мы гасим её плавно. */
      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        background-color: oklch(0.145 0 0);
        transition: opacity 160ms ease;
      }

      .boot-splash-content {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family:
          'Inter Variable',
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        font-size: 16px;
        font-weight: 600;
        animation: boot-splash-pulse 1.4s ease-in-out infinite;
      }

      /* У каждого раздела свой бренд: база, «Железяки» и остальной сайт. */
      .boot-splash-brand {
        display: none;
        align-items: center;
        gap: 8px;
      }

      .boot-splash-brand-home {
        display: flex;
      }

      html[data-splash='db'] .boot-splash-brand-home,
      html[data-splash='pc'] .boot-splash-brand-home {
        display: none;
      }

      html[data-splash='db'] .boot-splash-brand-db,
      html[data-splash='pc'] .boot-splash-brand-pc {
        display: flex;
      }

      .boot-splash svg {
        width: 24px;
        height: 24px;
      }

      .boot-splash-brand-db svg {
        color: oklch(0.723 0.219 149.579);
      }

      .boot-splash-brand-pc svg {
        color: oklch(0.8 0.15 80);
      }

      .boot-splash--hidden {
        animation: none;
        opacity: 0;
      }

      @keyframes boot-splash-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-splash {
          transition: none;
        }
        .boot-splash-content {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot-splash" class="boot-splash" aria-hidden="true">
      <div class="boot-splash-content">
        <span class="boot-splash-brand boot-splash-brand-home">Сайт Лешота</span>
        <span class="boot-splash-brand boot-splash-brand-db">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect width="8" height="18" x="3" y="3" rx="1" />
            <path d="M7 3v18" />
            <path
              d="M20.4 18.9c.2.5-.1 1.1-.6 1.3l-1.9.7c-.5.2-1.1-.1-1.3-.6L11.1 5.1c-.2-.5.1-1.1.6-1.3l1.9-.7c.5-.2 1.1.1 1.3.6Z"
            />
          </svg>
          Кладовка
        </span>
        <span class="boot-splash-brand boot-splash-brand-pc">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 20v2" />
            <path d="M12 2v2" />
            <path d="M17 20v2" />
            <path d="M17 2v2" />
            <path d="M2 12h2" />
            <path d="M2 17h2" />
            <path d="M2 7h2" />
            <path d="M20 12h2" />
            <path d="M20 17h2" />
            <path d="M20 7h2" />
            <path d="M7 20v2" />
            <path d="M7 2v2" />
            <rect x="4" y="4" width="16" height="16" rx="2" />
            <rect x="8" y="8" width="8" height="8" rx="1" />
          </svg>
          Железяки
        </span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
